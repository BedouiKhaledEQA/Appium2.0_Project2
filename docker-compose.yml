services:
  android:
    image: budtmo/docker-android-x86-8.1
    privileged: true
    ports:
      - "5554:5554"
      - "5555:5555"
      - "4723:4723"
    environment:
      - DEVICE=Pixel_6_API_30
      - APPIUM=true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    healthcheck:
      test: adb devices
      interval: 30s
      timeout: 10s
      retries: 5
