version: '3.8'

services:
  android:
    image: budtmo/docker-android:emulator_11.0
    privileged: true
    ports:
      - "5554:5554"
      - "5555:5555"
      - "4723:4723"
    environment:
      - DEVICE=Samsung Galaxy S10
      - APPIUM=true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    healthcheck:
      test: adb devices
      interval: 30s
      timeout: 10s
      retries: 5

  tests:
    image: maven:3.9.5-openjdk-17
    container_name: appium-tests
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      - android
    entrypoint: ["mvn", "test", "-Denv=local"]
