name: Run Appium Tests

on:
  push:
    branches:
      - master

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Run Docker Compose
        run: docker-compose up -d

      - name: Wait for emulator and Appium to be ready
        run: |
          echo "⏳ Attente du démarrage de l'émulateur et d'Appium..."
          # Attente de 60 secondes pour laisser l'émulateur et Appium démarrer
          sleep 60
          
          # Vérifier l'état de l'émulateur
          echo "📱 État de l'émulateur :"
          docker-compose exec android adb devices || echo "Émulateur non trouvé"
          
          # Vérifier l'état d'Appium
          echo "🌐 Statut Appium :"
          curl http://localhost:4723/status || echo "Appium ne répond pas"

      - name: Check Appium container logs
        run: |
          echo "📄 Logs Appium (android) :"
          docker-compose logs android

      - name: Run Appium Tests
        run: |
          echo "🚀 Démarrage des tests Appium..."
          docker-compose exec tests mvn test -Denv=local

      - name: Check test logs
        run: |
          echo "📄 Logs des tests :"
          docker-compose logs tests
